# Render Blueprint: one free web service (this repo's Dockerfile) and one free Postgres.
# Render → New → Blueprint → pick this repo. It asks for the values marked sync: false.
# On first boot, bin/docker-entrypoint runs db:prepare, which loads the schema into the empty
# database and runs db/seeds.rb (HR login + 10,000 employees). Later deploys only migrate.
databases:
  - name: acme-salary-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    databaseName: acme_salary
    user: acme_salary

services:
  - type: web
    name: acme-salary
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: acme-salary-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false # contents of config/master.key
      - key: HR_EMAIL
        sync: false
      - key: HR_PASSWORD
        sync: false # at least 12 characters
